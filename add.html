<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0C1117" media="(prefers-color-scheme: dark)" />
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Thêm giao dịch — Sổ Thu Chi</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" />
<link rel="manifest" href="manifest.json" crossorigin="use-credentials" />
<meta name="application-name" content="Sổ Thu Chi" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Thu Chi" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css" />
<script src="js/pwa-install.js" defer></script>
</head>
<body>
<main>
<div class="add-wrap">
  <div class="page-head">
    <div><span class="eyebrow"><a href="javascript:history.back()">‹ Quay lại</a></span><h1 id="page-title">Thêm giao dịch</h1></div>
  </div>

  <div class="type-toggle" role="tablist" aria-label="Loại giao dịch">
    <button type="button" id="type-expense" class="expense" role="tab">Chi</button>
    <button type="button" id="type-income" class="income" role="tab">Thu</button>
    <button type="button" id="type-transfer" class="transfer" role="tab">Chuyển khoản</button>
  </div>

  <section class="card ai-quick" id="ai-quick" style="margin-top:12px">
    <label for="ai-text"><span data-ico="sparkle"></span>Nhập nhanh bằng câu nói</label>
    <div class="ai-quick-row">
      <input type="text" id="ai-text" placeholder="VD: ăn sáng 35k tiền mặt hôm qua" />
      <button type="button" class="icon-btn" id="ai-mic" aria-label="Nói"></button>
      <button type="button" class="btn btn-primary" id="ai-fill">Điền</button>
    </div>
    <div class="small muted" id="ai-msg" style="margin-top:6px">AI điền sẵn các ô bên dưới — bạn xem lại rồi tự bấm Lưu.</div>
  </section>

  <form id="tx-form" class="card" style="margin-top:12px" novalidate>
    <div class="amount-box expense" id="amount-box">
      <label for="f-amount">Số tiền</label>
      <div class="amount-input"><input type="text" inputmode="numeric" id="f-amount" required placeholder="0" autocomplete="off" /><span class="cur">₫</span></div>
      <div class="quick-amt" id="quick-amt"></div>
    </div>

    <div class="field" id="category-field">
      <span class="field-label">Danh mục</span>
      <select id="f-category" class="sr-select" tabindex="-1" aria-hidden="true"></select>
      <div class="cat-grid" id="cat-grid" role="radiogroup" aria-label="Danh mục"></div>
    </div>

    <div class="field">
      <label for="f-date">Ngày</label>
      <div class="row">
        <input type="date" id="f-date" required style="flex:1;min-width:150px" />
        <button type="button" class="chip" data-day="0">Hôm nay</button>
        <button type="button" class="chip" data-day="-1">Hôm qua</button>
      </div>
    </div>

    <div class="field" id="payment-field">
      <label for="f-payment">Thanh toán bằng</label>
      <select id="f-payment"></select>
    </div>
    <div class="row" id="transfer-fields" style="display:none">
      <div class="field" id="from-payment-field"><label for="f-from-payment">Từ</label><select id="f-from-payment"></select></div>
      <div class="field" id="to-payment-field"><label for="f-to-payment">Đến</label><select id="f-to-payment"></select></div>
    </div>

    <div class="field" id="priority-field">
      <span class="field-label">Mức độ cần thiết</span>
      <select id="f-priority" class="sr-select" tabindex="-1" aria-hidden="true"></select>
      <div class="segmented" id="prio-seg"></div>
    </div>

    <div class="field">
      <label for="f-note">Ghi chú</label>
      <input type="text" id="f-note" placeholder="VD: ăn sáng bánh canh" list="note-suggest" autocomplete="off" />
      <datalist id="note-suggest"></datalist>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" id="submit-btn">Lưu giao dịch</button>
      <button type="button" class="btn btn-secondary" id="save-more">Lưu &amp; thêm tiếp</button>
    </div>
    <button type="button" class="btn btn-danger btn-block hidden" id="delete-btn" style="margin-top:10px">Xoá giao dịch</button>
  </form>
</div>
</main>
<script type="module" src="js/add.js"></script>
</body>
</html>
