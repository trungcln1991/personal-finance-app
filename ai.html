<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0C1117" media="(prefers-color-scheme: dark)" />
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Trợ lý AI — Sổ Thu Chi</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<main>
  <div class="page-head"><div><span class="eyebrow">Claude đọc sổ 3 tháng gần nhất · không tự ghi gì</span><h1>Trợ lý tài chính</h1></div>
    <button class="btn btn-primary" id="btn-review"><span data-ico="pie"></span>Nhận xét tháng này</button></div>
  <div class="ai-shell">
    <section class="card">
      <div class="ai-chat" id="chat"></div>
      <div class="ai-chips" id="chips"></div>
      <form id="ask-form" class="ai-ask">
        <textarea id="ask" rows="2" placeholder="VD: Tháng này tiền chợ tăng vì sao? Muốn tiết kiệm 3 triệu thì cắt ở đâu?"></textarea>
        <div class="ai-ask-row"><span class="muted small" id="left"></span>
          <div class="row"><button type="button" class="icon-btn" id="mic" aria-label="Nói"></button><button class="btn btn-primary">Hỏi</button></div></div>
      </form>
    </section>
    <p class="small muted">🔒 Số liệu gửi tới Claude qua tài khoản riêng của gia đình, không lưu lại ở bên thứ ba. Tối đa 30 lượt/ngày.</p>
  </div>
</main>
<script type="module" src="js/ai.js"></script>
</body>
</html>
